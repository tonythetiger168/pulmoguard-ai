# site.yml: deploy the public PulmoGuard page (site/) to Cloudflare Pages.
# Needs repo secrets CLOUDFLARE_API_TOKEN (Pages:Edit) and CLOUDFLARE_ACCOUNT_ID.
# PRs get a preview URL; pushes to main publish to production.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Cloudflare secrets not set; skipping deploy."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3.114.0 pages project create pulmoguard --production-branch=main || true
          npx --yes wrangler@3.114.0 pages deploy site --project-name=pulmoguard --branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

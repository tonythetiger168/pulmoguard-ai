# config_luna16.yaml — LUNA16 baseline 訓練組態（供 train_baseline.py 或 Hydra 使用）
# 對應研發執行手冊 1.2 假陽性削減模組

data:
  annotations: data/luna16/annotations.csv      # 1,186 正例（真結節）
  candidates: data/luna16/candidates_V2.csv     # 約 75.5 萬候選點（class=1 為真結節；V1 為 551,065）
  meta: data/processed/meta.csv                 # 前處理輸出：origin/spacing/direction/subset
  npy_dir: data/processed/npy                   # 前處理後 1mm、HU 窗正規化 float16 npy
  patch_size: [64, 64, 64]                      # 64³ 比 96³ 省約 3.4 倍運算
  pos_neg_ratio: 0.333                          # 正:負 = 1:3
  val_subset: null                              # 多 subset 時設官方 fold（如 0）；單 subset 自動依病人切 20%

train:
  model: densenet_3d_small                      # DenseNet block_config (4,8,12,10)
  epochs: 30
  patience: 5                                   # 早停，省 GPU 時數
  amp: true                                     # 混合精度
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  pos_weight: 1.0                               # 已 1:3 降採樣，不再加權
  seed: 42

eval:
  metric: AUC
  target_auc: 0.90                              # 達標即轉入偵測任務（nnDetection）
  froc_eval: true                               # 上傳 Grand Challenge 驗證 CPM

mlops:
  experiment_tracker: mlflow
  data_versioning: dvc
  artifact_dir: runs/baseline

# 10-fold 交叉驗證注意事項：
# - LUNA16 官方提供 10 個 fold 的 seriesuid 清單（subset0-9），
#   正式驗證應依官方 fold 切分並回報平均 CPM，本 config 為單折快速 baseline。
# - 偵測任務（CADe）請改用 nnDetection，以本資料集完成 baseline 後切換：
#   nnDetection 預設即支援 LUNA16 格式，可直接套用其 luna16 預設組態。
